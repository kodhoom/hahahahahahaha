<!DOCTYPE html><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاهد الفيديو</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  background: #fff;
  padding: 20px;
  font-size: 25px;
  font-weight: bold;
  border-bottom: 1px solid #ddd;
}

.logo {
  color: red;
}

.card {
  max-width: 550px;
  margin: 35px auto;
  padding: 20px;
  background: white;
  border-radius: 15px;
}

.thumbnail {
  background: #181818;
  color: white;
  padding: 90px 10px;
  border-radius: 12px;
}

.play {
  background: red;
  color: white;
  border: none;
  border-radius: 50%;
  font-size: 35px;
  padding: 15px 22px;
  cursor: pointer;
}

.watch {
  background: red;
  color: white;
  border: none;
  padding: 15px;
  width: 100%;
  font-size: 18px;
  border-radius: 8px;
  cursor: pointer;
}

#prank {
  display: none;
  background: black;
  color: lime;
  position: fixed;
  inset: 0;
  padding-top: 35vh;
  font-size: 25px;
}

#reveal {
  display: none;
  position: fixed;
  inset: 0;
  background: white;
  color: black;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 35px;
}
</style>
</head>

<body>

<header>
  <span class="logo">▶ YouTube</span>
</header>

<div class="card">
  <div class="thumbnail">
    <button class="play" onclick="start()">▶</button>
    <h2>مقطع خاص لك 😂</h2>
  </div>

  <h3>شاهد الفيديو قبل لا يفوتك!</h3>
  <p>تمت مشاركة هذا المقطع معك.</p>

  <button class="watch" onclick="start()">
    ▶ شاهد الفيديو
  </button>
</div>

<div id="prank">
  <h2>⚠️ جاري تشغيل المقلب ⚠️</h2>
  <p>انتظر قليلاً...</p>
</div>

<div id="reveal">
  😂 انكشف المقلب!
  <p style="font-size:18px">
    لا تخاف، جهازك سليم ولم يتم الوصول إلى بياناتك.
  </p>
</div>

<script>
function start() {
  document.querySelector('.card').style.display = 'none';
  document.querySelector('header').style.display = 'none';
  document.getElementById('prank').style.display = 'block';

  setTimeout(function() {
    document.getElementById('prank').style.display = 'none';
    document.getElementById('reveal').style.display = 'flex';
  }, 9000);
}
</script>

</body>
</html>
